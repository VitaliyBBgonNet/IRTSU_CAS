<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/table.css}" type="text/css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Возврат компонентов</title>
    <style>
        .status-indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            vertical-align: middle;
            cursor: pointer;
        }
        .status-yellow { background-color: #ffc107; }  /* На модерации */
        .status-red { background-color: #dc3545; }     /* Отклонено (REJECTED) */
        .status-green { background-color: #28a745; }   /* Отменено (CANCEL) */
    </style>
</head>
<body>
<div class="container py-3">
    <div th:replace="~{header.html :: header}"></div>
</div>

<div class="container py-3">
    <h2 class="text-center mb-4">Возврат арендованных компонентов</h2>
    <br>
    <div class="col">
        <table class="table table-sm table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Действие</th>
                <th>Статус</th>
            </tr>
            </thead>
            <tbody id="componentListBody"></tbody>
        </table>
    </div>
</div>

<script>
    let componentsList = [];

    function fetchRentedComponents() {
        const token = localStorage.getItem("token");
        fetch("/details/getMyRentedComponents", {
            method: "GET",
            headers: {
                "Authorization": token ? "Bearer " + token : ""
            }
        })
            .then(response => {
                if (!response.ok) throw new Error("Ошибка при получении компонентов");
                return response.json();
            })
            .then(data => {
                componentsList = data;
                loadTable(); // Загружаем таблицу сразу после получения данных
            })
            .catch(error => console.error("Ошибка:", error));
    }

    function getStatusClass(moderationStatus) {
        if (moderationStatus === 'MODERATION') return 'status-yellow';
        if (moderationStatus === 'CANCEL') return 'status-green';
        if (moderationStatus === 'REJECTED') return 'status-red';
        return 'status-red'; // По умолчанию красный, если статус неизвестен
    }

    function getTooltipText(moderationStatus) {
        if (moderationStatus === 'MODERATION') return 'На модерации';
        if (moderationStatus === 'CANCEL') return 'Отменено';
        if (moderationStatus === 'REJECTED') return 'Отклонено';
        return 'Не отправлен на модерацию';
    }

    function loadTable() {
        const token = localStorage.getItem("token");
        fetch("/details/getMyRentedComponents", {
            method: "GET",
            headers: {
                "Authorization": token ? "Bearer " + token : ""
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Ошибка загрузки данных: " + response.status);
                }
                return response.json();
            })
            .then(data => {
                let tableBody = document.getElementById("componentListBody");
                tableBody.innerHTML = "";

                data.forEach(component => {
                    let row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${component.id}</td>
                        <td>${component.name === " " ? "Не указано" : component.name}</td>
                        <td>${component.description === "-" ? "Не указано" : component.description}</td>
                        <td>
                            <button
                                style="margin: 2px"
                                class="btn return-btn ${component.moderationStatus === 'MODERATION' ? 'btn-secondary' : 'btn-warning'}"
                                data-id="${component.id}"
                                ${component.moderationStatus === 'MODERATION' ? 'disabled' : ''}>
                                Вернуть
                            </button>
                            <button
                                style="margin: 2px"
                                class="btn cancel-btn ${component.moderationStatus !== 'MODERATION' ? 'btn-secondary' : 'btn-danger'}"
                                data-id="${component.id}"
                                ${component.moderationStatus !== 'MODERATION' ? 'disabled' : ''}>
                                Отмена
                            </button>
                        </td>
                        <td>
                            <span
                                class="status-indicator ${getStatusClass(component.moderationStatus)}"
                                data-bs-toggle="tooltip"
                                data-bs-placement="top"
                                data-bs-title="${getTooltipText(component.moderationStatus)}">
                            </span>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Инициализация tooltips после загрузки таблицы
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl);
                });
            })
            .catch(error => {
                console.error("Ошибка загрузки данных:", error);
                alert("Не удалось загрузить данные: " + error.message);
            });
    }

    document.addEventListener("DOMContentLoaded", function() {
        fetchRentedComponents(); // Загружаем данные при загрузке страницы
    });

    document.getElementById("componentListBody").addEventListener("click", function(event) {
        const returnButton = event.target.closest(".return-btn");
        if (returnButton && !returnButton.disabled) {
            const itemId = returnButton.getAttribute("data-id");
            if (!confirm(`Вы уверены, что хотите вернуть компонент с ID ${itemId}?`)) {
                return;
            }

            fetch(`/details/returnComponent?id=${encodeURIComponent(itemId)}`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token"),
                    "Content-Type": "application/json"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || "Ошибка при возврате!");
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    alert(data.message || "Компонент успешно отправлен на модерацию");
                    loadTable();
                })
                .catch(error => {
                    console.error("Ошибка при возврате:", error);
                    alert(error.message);
                });
        }

        const cancelButton = event.target.closest(".cancel-btn");
        if (cancelButton && !cancelButton.disabled) {
            const itemId = cancelButton.getAttribute("data-id");
            if (!confirm(`Вы уверены, что хотите отменить модерацию компонента с ID ${itemId}?`)) {
                return;
            }

            fetch(`/details/cancelModeration?id=${encodeURIComponent(itemId)}`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token"),
                    "Content-Type": "application/json"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.message || "Ошибка при отмене модерации!");
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    alert(data.message || "Модерация компонента отменена");
                    loadTable();
                })
                .catch(error => {
                    console.error("Ошибка при отмене модерации:", error);
                    alert(error.message);
                });
        }
    });
</script>

<script src="https://unpkg.com/htmx.org@1.8.4"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
